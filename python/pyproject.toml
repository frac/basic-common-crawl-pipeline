[tool.poetry]
name = "common_crawl_pipeline"
version = "0.1.0"
description = "A common crawl pipeline"
authors = ["petrich@gmail.com"]
packages = [
{ include = "bccp" },
]

[tool.poetry.dependencies]
python = "^3.12"
trafilatura = ">=2.0.0"
pika = ">=1.3.2"
prometheus-client = ">=0.22.1"
requests = ">=2.32.4"
types-requests = "^2.32.4.20250611"
warcio = ">=1.7.4"
minio = "^7.2.16"
tokenizers = "^0.21.2"
transformers = "^4.53.3"
tenacity = "^9.1.2"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
coverage = "^7.6.12"
flake8 = "^7.1.2"
isort = "^6.0.1"
mypy = "^1.15.0"
pytest = "^8.3.5"
requests-mock = ">=1.12.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
